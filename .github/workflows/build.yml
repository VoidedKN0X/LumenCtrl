name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

# Nothing by default; each job gets only what it needs.
permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of LumenCtrl's release signing certificate, the one in SECURITY.md and README.md
  # (lower case, no colons). The sign job refuses to hand on an APK signed with anything else.
  EXPECTED_CERT_SHA256: fded53e214ddbad33bb354dd813799155d1926896ef1ab288cbd2ea33e47be81

jobs:
  # A release is published only when versionName (and versionCode) in
  # app/build.gradle.kts are bumped. Other pushes just build to check the code.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to see whether this version is already released

      - name: Check for a version bump
        id: v
        run: bash .github/scripts/check-version.sh

  # Builds the release APK UNSIGNED. This job runs Gradle, and with it every plugin, dependency and
  # build script, so it gets no secrets at all: the signing key only exists in the sign job below.
  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # app/build.gradle.kts: build the release without a signing config (app-release-unsigned.apk).
      UNSIGNED_RELEASE: "true"
    outputs:
      apk_sha256: ${{ steps.pack.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the documented signing certificate
        # The fingerprint the sign job enforces must be the one users are told to check.
        run: |
          colons=$(echo "$EXPECTED_CERT_SHA256" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          for f in SECURITY.md README.md; do
            if ! grep -qF "$colons" "$f"; then
              echo "::error title=Fingerprint mismatch::EXPECTED_CERT_SHA256 in build.yml is not the fingerprint in $f"
              exit 1
            fi
          done
          echo "build.yml, SECURITY.md and README.md agree on $colons"

      # Refuses a tampered Gradle wrapper jar (same gradle/actions release as setup-gradle).
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # No Gradle cache: every build downloads its dependencies fresh and checks them against
          # gradle/verification-metadata.xml. A cache saved by one run (also by a failed one) was
          # restored by every later run, so one bad download kept failing builds until the caches
          # were deleted by hand; and a release must not be built from files an earlier run left behind.
          cache-disabled: true

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Check the app is Google-free
        run: |
          set -o pipefail
          # Every library that ends up in the APK, including transitive ones. Nothing from Google but LiteRT
          # (Play services, Firebase, Guava, Gson, Protobuf, Material Components...) may be in it.
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps-all.txt
          # One documented exception: LiteRT (com.google.ai.edge.litert), the open-source Apache 2.0
          # on-device ML runtime for AI masks and AI Denoise. No Play services, Firebase or network code.
          grep -vE 'com\.google\.ai\.edge\.litert:' deps-all.txt > deps.txt || true
          if grep -qE 'com\.google\.|firebase|play-services|gms' deps.txt; then
            # One annotation per distinct library, with the line that pulls it in, so it shows on the run page.
            grep -E 'com\.google\.|firebase|play-services|gms' deps.txt | sed -E 's/^[| \\+-]+//; s/ \(\*\)$//' | sort -u | head -20 | while IFS= read -r line; do
              echo "::error title=Google dependency::${line}"
            done
            # And which library brings each one in.
            grep -oE '(com\.google\.[a-z.]+|[a-z.]*firebase[a-z.]*):[A-Za-z0-9_.-]+' deps.txt | sort -u | head -5 | while IFS= read -r mod; do
              ./gradlew --no-daemon -q :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency "$mod" \
                | grep -E '^\s*\\---|^\s*\+---' | sed -E 's/^[| \\+-]+//' | head -4 | while IFS= read -r via; do
                  echo "::warning title=${mod} comes from::${via}"
                done
            done
            exit 1
          fi
          echo "No Google libraries in the release build except LiteRT (allowed, see README)."

      - name: Check the APK is offline
        run: |
          # LumenCtrl must never be able to go online: no INTERNET or network-state permission in the APK.
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$aapt2" dump permissions "$apk" | tee perms.txt
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)' perms.txt; then
            echo "::error title=Network permission::The APK asks for a network permission. LumenCtrl must stay offline."
            exit 1
          fi
          echo "No network permissions in the APK."

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler and Gradle errors as annotations so they show on the run page and in the API.
          [ -f build.log ] || exit 0
          grep -E '^e: |^ERROR:|error: |What went wrong' -A 3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Collect the unsigned APK
        id: pack
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Exactly one APK, and it must be the unsigned one: this job has no key to sign with.
          set -- app/build/outputs/apk/release/*.apk
          if [ "$#" -ne 1 ] || [ "$(basename "$1")" != "app-release-unsigned.apk" ]; then
            echo "::error title=Unexpected build output::Expected only app-release-unsigned.apk, found: $*"
            exit 1
          fi
          mkdir -p out
          cp "$1" "out/LumenCtrl-${TAG}-unsigned.apk"
          sum=$(sha256sum "out/LumenCtrl-${TAG}-unsigned.apk" | cut -d' ' -f1)
          echo "apk_sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Unsigned APK SHA-256: $sum"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Not installable: Android refuses an unsigned APK. The signed one is LumenCtrl-apk.
          name: LumenCtrl-unsigned-apk
          path: out/*.apk
          if-no-files-found: error

  # Signs the APK the build job made. The only job that sees the release key, and it runs no code
  # from this repo: no checkout, no Gradle, only zipalign and apksigner from the runner's Android SDK.
  sign:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions: {}   # no token rights at all; artifacts of this run need none
    outputs:
      release_signed: ${{ steps.sign.outputs.release_signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LumenCtrl-unsigned-apk
          path: unsigned

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          TAG: ${{ needs.version.outputs.tag }}
          BUILT_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No KEYSTORE_BASE64 secret set - refusing to publish an APK that isn't signed with the release key. Add the release key secrets."
            exit 1
          fi
          in="unsigned/LumenCtrl-${TAG}-unsigned.apk"
          # The file the build job made, byte for byte.
          echo "$BUILT_SHA256  $in" | sha256sum -c -

          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Android build-tools: $tools"
          mkdir -p work out
          # Gradle already aligns the APK; align only if it isn't (signing must come after aligning).
          if "${tools}zipalign" -c -P 16 4 "$in"; then
            cp "$in" work/aligned.apk
          else
            "${tools}zipalign" -P 16 -f 4 "$in" work/aligned.apk
          fi

          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # The same schemes the Android Gradle plugin used for these releases (minSdk 35): APK
          # Signature Scheme v2 only. Passwords are read from the environment, never the command line.
          "${tools}apksigner" sign \
            --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "out/LumenCtrl-${TAG}.apk" work/aligned.apk
          rm -f "$ks"
          echo "release_signed=true" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check release signature
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The APK must be signed with LumenCtrl's release key, or phones won't accept it as an update.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          apk="out/LumenCtrl-${TAG}.apk"
          "${tools}apksigner" verify --verbose --print-certs "$apk" | tee signer.txt
          signers=$(grep -c 'certificate SHA-256 digest: ' signer.txt || true)
          actual=$(grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]+' signer.txt || true)
          if [ "$signers" != "1" ] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Wrong signing key::$apk has $signers signer(s), first ${actual:-none}; expected only the LumenCtrl release key $EXPECTED_CERT_SHA256"
            exit 1
          fi
          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signer.txt; then
            echo "::error title=Not v2-signed::$apk has no valid APK Signature Scheme v2 signature"
            exit 1
          fi
          "${tools}zipalign" -c -P 16 4 "$apk"
          # Signing must not have changed anything inside the APK: same files, same contents, same order.
          python3 - "unsigned/LumenCtrl-${TAG}-unsigned.apk" "$apk" <<'PY'
          import sys, zipfile
          a, b = ([(i.filename, i.CRC, i.file_size, i.compress_type) for i in zipfile.ZipFile(p).infolist()] for p in sys.argv[1:3])
          if a != b:
              sys.exit("::error title=APK changed while signing::The signed APK's contents differ from the APK the build job made")
          print(f"Signed APK has the same {len(a)} files as the build job's APK.")
          PY
          echo "::notice title=Signed::APK signed with the LumenCtrl release key ($actual)"
          sha256sum "$apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LumenCtrl-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: [version, build, sign]
    if: needs.version.outputs.release == 'true' && needs.sign.outputs.release_signed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance (Sigstore)
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - name: Write release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LumenCtrl-apk
          path: out

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*.apk

      - name: Add the APK checksum to the release notes
        run: |
          {
            echo
            for f in out/*.apk; do
              echo "SHA-256: \`$(sha256sum "$f" | cut -d' ' -f1)\`  $(basename "$f")"
            done
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        # Allowed by the repo's Actions policy and used across the Ctrl series, instead of a gh script.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LumenCtrl ${{ needs.version.outputs.version }}
          files: out/*.apk
          body_path: ${{ runner.temp }}/notes.md
